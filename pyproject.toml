[tool.poetry]
name = "dosa"
version = "0.1.0"
description = ""
authors = ["Bohou Li <bohou@aryn.ai>"]
readme = "README.md"
packages = [{ include = "dosa" }]

[tool.poetry.dependencies]
python = "^3.10"
torch = "2.7.1"
torchvision = "0.22.1"
pypdfium2 = "4.30.0"
black = "^24.4.2"
ruff = "^0.5.2"
pre-commit = "^3.7.1"
pdf2image = "^1.17.0"
sentence-transformers = "^3.0.1"
pytest = "^8.3.2"
timm = "^1.0.9"
pandas = "^2.2.2"
matplotlib = "^3.9.2"
seaborn = "^0.13.2"
nltk = "^3.9.1"
apted = "^1.0.3"
setuptools = "^75.8.1"
jupyter = "^1.1.1"
notebook = "^7.5.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 80

[tool.black]
line-length = 80

[tool.pytest.ini_options]
pythonpath = ["."]
